<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="纯前端泡泡游戏，支持手机端游玩">
    <meta name="keywords" content="泡泡游戏,Emoji,合成游戏,手机游戏">
    <title>🫧 泡泡游戏</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <!-- 标题 -->
            <div class="header-frame">
                <div class="frame-inner">
                    <h1>泡泡游戏</h1>
                    <div class="game-mode">- NORMAL -</div>
                </div>
            </div>

            <!-- 主要游戏区域 -->
            <div class="main-game-area">
                <!-- Canvas 游戏区 -->
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="450" height="600"></canvas>
                    <div id="chainDisplay" class="chain-display">0 Chain!</div>
                    <div id="aimingIndicator" class="aiming-indicator">
                        <div id="aimingEmoji" class="aiming-emoji"></div>
                        <div class="aiming-character"></div>
                        <div class="aiming-triangle"></div>
                    </div>
                </div>
            </div>

            <!-- 分数 -->
            <div class="score-settings-row">
                <div class="score-frame">
                    <div class="frame-inner">
                        <div>得分: <span id="score">0</span>pt</div>
                        <div>最高分: <b><span id="highScore">0</span>pt</b></div>
                    </div>
                </div>
            </div>

            <!-- Fusion Recipe -->
            <div class="recipe-frame">
                <div class="frame-inner">
                    <div class="recipe-title">FUSION RECIPE</div>
                    <div id="fusionRecipe" class="recipe-items"></div>
                </div>
            </div>

            <!-- 控制区 -->
            <div class="controls-section">
                <div class="grab-row">
                    <div class="frame-inner grab-button-inner">
                        <button id="dropBtn" class="btn btn-catch">
                            <div class="btn-icon"></div>
                            <div class="btn-text">抓住</div>
                        </button>
                    </div>
                    <div class="frame-inner grab-next-inner">
                        <div id="nextDropDisplay" class="next-drop-items"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="gameOverModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h2>游戏结束!</h2>
            <div class="game-over-stats">
                <p><label>最终分数:</label> <strong id="finalScore">0</strong></p>
                <p><label>最高连击:</label> <strong id="maxCombo">0</strong></p>
            </div>
            <button id="modalRestartBtn" class="btn btn-catch btn-large">
                <div class="btn-icon"></div>
                <div class="btn-text">再来一局</div>
            </button>
        </div>
    </div>

    <!-- 直接打开 index.html 即可运行：依赖通过 CDN 加载，无需 npm install -->
    <script src="https://unpkg.com/seedrandom@3.0.5/seedrandom.min.js"></script>
    <script src="https://unpkg.com/matter-js@0.19.0/build/matter.min.js"></script>

    <script src="js/monos.js"></script>
    <script src="js/game.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input-handler.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
